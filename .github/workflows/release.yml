name: Release

on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Comma/space-separated project names to release (e.g. core). Empty = all projects with pending changes.'
        type: string
        default: ''
      first_release:
        description: "First release for the selected project(s): forces an explicit 1.0.0 (or 1.0.0-<phase>.0) version instead of a conventional-commits bump, and switches npm publish to a classic NPM_TOKEN instead of OIDC Trusted Publisher (which can't be configured on npm before the package exists)"
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: no git push, no real publish (PUBLIB_DRYRUN=true)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify branch is releasable
        run: pnpm nx run-many -t lint test build typecheck

      # `main` releases every package according to its own current phase tag
      # (alpha/beta/rc/stable, independently per package), with a guardrail
      # that anything released as "stable" must also have package.json's jsii
      # `stability` field set to "stable". `next` is for occasional,
      # coordinated multi-package work and may reach at most "rc" - stable
      # graduation only happens on main. This workflow must only ever be
      # dispatched from main or next - see tools/validate-release-phase.mjs.
      - name: Validate release phase matches branch
        run: >
          node tools/validate-release-phase.mjs ${{ github.ref_name }}
          ${{ inputs.projects && format('--projects={0}', inputs.projects) || '' }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
      jsii-projects: ${{ steps.list-jsii-projects.outputs.projects }}
      ts-projects: ${{ steps.list-ts-projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      # Needed here, not in a separate build job: the jsii release group's
      # groupPreVersionCommand (nx.json) runs `nx run-many -t build -p tag:jsii`
      # as part of the version step below, which cascades into jsii-package-all
      # (packages/nx's build->jsii-package-all dependsOn) - so every jsii
      # language gets fully packaged right here, before these toolchains would
      # otherwise be needed again downstream.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - run: pnpm install --frozen-lockfile

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Runs releaseVersion()+releaseChangelog() (Nx's programmatic release API,
      # via tools/release.mjs) once per release phase, instead of shelling out
      # to the CLI per project - version bump and changelog generation happen
      # together, per phase, with versionData threaded directly from the
      # version call into the changelog call, so no per-project loop and no
      # explicit --version argument are needed. See tools/release.mjs's header
      # for why the programmatic API (not the combined `nx release` CLI
      # command) is what makes gitCommit/gitTag controllable per call with no
      # nx.json changes.
      #
      # Prints the list of projects that actually got a real version bump as
      # its last stdout line (nx's own logging may print other lines first) -
      # `tail -1` isolates it regardless of how much precedes it.
      - name: Bump versions and generate changelogs
        id: version
        run: |
          released=$(node tools/release.mjs version --git-commit --git-tag \
            ${{ inputs.projects && format('--projects={0}', inputs.projects) || '' }} \
            ${{ inputs.first_release && '--first-release' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tail -1)
          echo "projects=$released" >> "$GITHUB_OUTPUT"

      - name: Push commits and tags
        if: ${{ !inputs.dry_run }}
        run: git push origin HEAD --follow-tags

      - name: Resolve released sha
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Dynamic {project, name, root, phase} lists for every released project in
      # each release group - lets the publish jobs below fan out per package
      # (and pick the right npm dist-tag per package's phase) without ever
      # hardcoding a package list in this workflow.
      - name: List released jsii projects
        id: list-jsii-projects
        run: echo "projects=$(node tools/release.mjs list --group=jsii --projects='${{ steps.version.outputs.projects }}')" >> "$GITHUB_OUTPUT"

      - name: List released ts projects
        id: list-ts-projects
        run: echo "projects=$(node tools/release.mjs list --group=ts --projects='${{ steps.version.outputs.projects }}')" >> "$GITHUB_OUTPUT"

      # Every jsii package's dist-jsii/* is already fully packaged at this
      # point (groupPreVersionCommand cascaded build -> jsii-package-all above)
      # - built once, here, and shared with every publish-* job below via this
      # single artifact, instead of each job re-running the (Java/.NET-
      # toolchain-dependent) packaging itself.
      - uses: actions/upload-artifact@v7
        with:
          name: jsii-dist
          path: packages/*/dist-jsii
          retention-days: 7

  publish-maven:
    needs: release
    if: ${{ needs.release.outputs.jsii-projects != '[]' }}
    runs-on: ubuntu-latest
    env:
      PUBLIB_DRYRUN: ${{ inputs.dry_run }}
      MAVEN_SERVER_ID: central-ossrh
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: jsii-dist
          path: /tmp/jsii-dist
      - name: Restore per-package dist-jsii from artifact
        run: |
          for root in $(echo '${{ needs.release.outputs.jsii-projects }}' | jq -r '.[].root'); do
            mkdir -p "$root/dist-jsii"
            cp -r "/tmp/jsii-dist/$(basename "$root")/dist-jsii/." "$root/dist-jsii/"
          done
      - name: Publish Maven
        run: |
          for root in $(echo '${{ needs.release.outputs.jsii-projects }}' | jq -r '.[].root'); do
            pnpm exec publib-maven "$root/dist-jsii/java"
          done

  publish-go:
    needs: release
    if: ${{ needs.release.outputs.jsii-projects != '[]' }}
    runs-on: ubuntu-latest
    env:
      PUBLIB_DRYRUN: ${{ inputs.dry_run }}
      GITHUB_TOKEN: ${{ secrets.GH_GO_MIRROR_TOKEN }}
      GIT_USER_NAME: github-actions[bot]
      GIT_USER_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: jsii-dist
          path: /tmp/jsii-dist
      - name: Restore per-package dist-jsii from artifact
        run: |
          for root in $(echo '${{ needs.release.outputs.jsii-projects }}' | jq -r '.[].root'); do
            mkdir -p "$root/dist-jsii"
            cp -r "/tmp/jsii-dist/$(basename "$root")/dist-jsii/." "$root/dist-jsii/"
          done
      - name: Publish Go module mirror
        run: |
          # Every package shares the same mirror repo, each landing in its own
          # subdirectory - the loop must stay sequential (no & backgrounding)
          # to avoid racing pushes to the same repo.
          for root in $(echo '${{ needs.release.outputs.jsii-projects }}' | jq -r '.[].root'); do
            pnpm exec publib-golang "$root/dist-jsii/go"
          done

  publish-pypi:
    needs: release
    if: ${{ needs.release.outputs.jsii-projects != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.release.outputs.jsii-projects) }}
    environment: pypi-${{ matrix.pkg.name }}
    env:
      PUBLIB_DRYRUN: ${{ inputs.dry_run }}
      PYPI_TRUSTED_PUBLISHER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: jsii-dist
          path: /tmp/jsii-dist
      - name: Restore dist-jsii from artifact
        run: |
          mkdir -p "${{ matrix.pkg.root }}/dist-jsii"
          cp -r "/tmp/jsii-dist/${{ matrix.pkg.name }}/dist-jsii/." "${{ matrix.pkg.root }}/dist-jsii/"
      - name: Publish PyPI
        run: pnpm exec publib-pypi "${{ matrix.pkg.root }}/dist-jsii/python"

  publish-npm:
    needs: release
    if: ${{ needs.release.outputs.jsii-projects != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.release.outputs.jsii-projects) }}
    environment: npm-${{ matrix.pkg.name }}
    env:
      PUBLIB_DRYRUN: ${{ inputs.dry_run }}
      # A "stable" package publishes under npm's default "latest" tag. Anything
      # else (alpha/beta/rc) must publish under its own phase tag so it never
      # becomes what `npm install <pkg>` resolves to - see matrix.pkg.phase,
      # sourced from each project's phase tag in project.json.
      NPM_DIST_TAG: ${{ matrix.pkg.phase != 'stable' && matrix.pkg.phase || '' }}
      NPM_TRUSTED_PUBLISHER: ${{ !inputs.first_release && '1' || '' }}
      NPM_TOKEN: ${{ inputs.first_release && secrets.NPM_TOKEN || '' }}
      NPM_ACCESS_LEVEL: public
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      # npm Trusted Publisher requires npm CLI >= 11.5.1; the bundled npm may be older.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: jsii-dist
          path: /tmp/jsii-dist
      - name: Restore dist-jsii from artifact
        run: |
          mkdir -p "${{ matrix.pkg.root }}/dist-jsii"
          cp -r "/tmp/jsii-dist/${{ matrix.pkg.name }}/dist-jsii/." "${{ matrix.pkg.root }}/dist-jsii/"
      - name: Publish npm
        run: pnpm exec publib-npm "${{ matrix.pkg.root }}/dist-jsii/js"

  publish-nuget:
    needs: release
    if: ${{ needs.release.outputs.jsii-projects != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: nuget
    env:
      PUBLIB_DRYRUN: ${{ inputs.dry_run }}
      NUGET_TRUSTED_PUBLISHER: '1'
      NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: jsii-dist
          path: /tmp/jsii-dist
      - name: Restore per-package dist-jsii from artifact
        run: |
          for root in $(echo '${{ needs.release.outputs.jsii-projects }}' | jq -r '.[].root'); do
            mkdir -p "$root/dist-jsii"
            cp -r "/tmp/jsii-dist/$(basename "$root")/dist-jsii/." "$root/dist-jsii/"
          done
      - name: Publish NuGet
        run: |
          for root in $(echo '${{ needs.release.outputs.jsii-projects }}' | jq -r '.[].root'); do
            pnpm exec publib-nuget "$root/dist-jsii/dotnet"
          done

  # Publishable projects that are NOT jsii-enabled (e.g. @cdk-x/nx, an ordinary
  # TypeScript-only package - the "ts" release group) skip the jsii packaging
  # pipeline above entirely and publish directly via Nx's standard
  # nx-release-publish (tools/release.mjs publish-ts), independent of the
  # jsii-dist artifact.
  publish-ts-npm:
    needs: release
    if: ${{ needs.release.outputs.ts-projects != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.release.outputs.ts-projects) }}
    environment: npm-${{ matrix.pkg.name }}
    env:
      # A "stable" package publishes under npm's default "latest" tag. Anything
      # else (alpha/beta/rc) must publish under its own phase tag so it never
      # becomes what `npm install <pkg>` resolves to - see matrix.pkg.phase,
      # sourced from each project's phase tag in project.json.
      NPM_DIST_TAG: ${{ matrix.pkg.phase != 'stable' && matrix.pkg.phase || 'latest' }}
      NPM_TOKEN: ${{ inputs.first_release && secrets.NPM_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      # npm Trusted Publisher requires npm CLI >= 11.5.1; the bundled npm may be older.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # Trusted Publisher (OIDC) is npm's default when id-token: write is
      # granted and no explicit auth is configured - only the first-release
      # case needs a classic token, since Trusted Publisher can't be set up
      # on npm before the package exists.
      - name: Configure classic npm token (first release only)
        if: ${{ inputs.first_release }}
        run: npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
      - name: Build
        run: pnpm nx build ${{ matrix.pkg.name }}
      - name: Publish npm
        run: >
          node tools/release.mjs publish-ts --projects=${{ matrix.pkg.project }}
          --tag=${{ env.NPM_DIST_TAG }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
